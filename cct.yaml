name: seo-audit
version: 0.2.0
description: "SEO 多专家 AI 审计系统 — 17 位领域专家分五批并行审计网站或本地项目，基于 352 黄金法则覆盖技术、内容、外链、竞品与数据全维度"
argument-hint: "<url> [--local] [--auto] [--api-key KEY] [--gsc] [--ga4 PROPERTY_ID] [--competitor DOMAIN1,DOMAIN2]"

targets:
  claude:
    trigger: /seo-audit
    path: SKILL.md
    install:
      - from: SKILL.md
        to: skills/seo-audit/SKILL.md
      - from: agents
        to: agents
      - from: shared
        to: skills/seo-audit/shared
      - from: references
        to: skills/seo-audit/references
      - from: workflows
        to: skills/seo-audit/workflows
      - from: scripts
        to: skills/seo-audit/scripts

prompts:
  - name: mode
    type: select
    message: "选择审计模式"
    options:
      - label: "远程 URL"
        value: "<url>"
      - label: "本地项目"
        value: "--local"
      - label: "自动模式 (跳过确认)"
        value: "--auto"
  - name: target_url
    type: input
    message: "输入目标网站 URL"
    when:
      field: mode
      equals: "<url>"
    validate: "^https?://"
  - name: api_enhance
    type: confirm
    message: "是否启用 API 数据增强（需要配置 Service Account）"
    default: false
  - name: psi_key
    type: input
    message: "输入 PageSpeed Insights API Key（留空跳过 PSI 数据）"
    when:
      field: api_enhance
      equals: true
  - name: gsc_enabled
    type: confirm
    message: "是否启用 Google Search Console 数据"
    default: false
    when:
      field: api_enhance
      equals: true
  - name: ga4_property
    type: input
    message: "输入 GA4 Property ID（留空跳过 GA4 数据）"
    when:
      field: api_enhance
      equals: true
  - name: competitor_domains
    type: input
    message: "输入竞品域名（逗号分隔，留空跳过竞品分析）"
    default: ""

output_dir: .seo-audit
report_pattern: "*/report.json"
global_timeout: 3600
agent_timeout: 600